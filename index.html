<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b67d1">
<meta name="description" content="Registra y consulta asistencias por grupos, incluso sin conexión después de instalar la aplicación.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Lista de Asistencias</title>
<style>
:root{--blue:#1268d5;--blue2:#0b58b8;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--green:#19a463;--yellow:#e9ad16;--red:#e53935}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:15px 18px;box-shadow:0 2px 10px #0002}
.head{display:flex;align-items:center;gap:12px}.head h1{font-size:22px;margin:0;flex:1}.iconbtn{border:0;background:#ffffff22;color:#fff;border-radius:12px;width:42px;height:42px;font-size:21px}
main{padding:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0000000c;margin-bottom:12px}
.tabs button{border:0;background:#fff;padding:13px 6px;color:#555;font-weight:600}.tabs button.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}
.search{position:relative;margin-bottom:10px}.search input{width:100%;padding:14px 16px 14px 45px;border:0;border-radius:14px;background:#eef0f4;outline:0}
.search span{position:absolute;left:15px;top:11px;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-weight:600}
.summary{background:#fff;border-radius:12px;padding:10px 13px;margin:10px 0;color:#475467;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0000000a}
.tablewrap{overflow-x:auto}.table{min-width:720px;width:100%;border-collapse:collapse}.table th{background:#f3f4f6;padding:11px;text-align:left;font-size:12px}.table td{border-top:1px solid var(--line);padding:9px}.name{font-weight:600}.small{font-size:12px;color:var(--muted)}
.check{width:25px;height:25px;accent-color:var(--green)}.status{display:inline-flex;padding:7px 12px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}.present{background:var(--green)}.just{background:var(--yellow)}.absent{background:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2ff;color:var(--blue)}.danger{background:#fff0f0;color:#c62828}.gray{background:#eef0f4;color:#344054}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bottom{position:sticky;bottom:0;background:#ffffffee;padding:10px 0;backdrop-filter:blur(8px)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:700px;margin:auto}.sheet h2{margin-top:0}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{font-size:24px;display:block}.metric.green b{color:var(--green)}.metric.yellow b{color:var(--yellow)}.metric.red b{color:var(--red)}
.months{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.months button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px}.months button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:650px){main{padding:10px}.grid2{grid-template-columns:1fr}.head h1{font-size:19px}.history-grid{grid-template-columns:1fr 1fr 1fr}.metric{padding:10px}.metric b{font-size:19px}.table{min-width:680px}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><button class="iconbtn" onclick="showHome()">⌂</button><h1>Lista de Asistencias</h1><button class="iconbtn" onclick="openSettings()">⚙</button></div></header>
<main id="app"></main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
const KEY="lista_asistencias_v1";
const GROUPS=["Grupo A","Grupo B","Grupo C","Grupo D"];
let db=load();
let group=0, screen="attendance", monthKey=localDate().slice(0,7);

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x&&x.groups&&x.records)return x;
  }catch(e){}
  return {groups:GROUPS.map(name=>({name,people:[]})),records:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function localDate(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function today(){return localDate()}
function fmtDate(v){if(!v)return"";let [y,m,d]=v.split("-");return `${d}/${m}/${y}`}
function ym(v){return v.slice(0,7)}
function monthName(k){let [y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"})}
function currentPeople(){return db.groups[group].people}
function recordFor(pid,date){return db.records.find(r=>r.group===group&&r.personId===pid&&r.date===date)}
function statusOf(pid,date){
  const r=recordFor(pid,date);
  if(!r)return "absent";
  return r.status||"absent";
}
function ensureRecord(pid,date,activity,status,justification=""){
  let r=recordFor(pid,date);
  if(!r){r={group,personId:pid,date,activity,status,justification};db.records.push(r)}
  else{r.activity=activity;r.status=status;r.justification=justification}
}
function render(){
  if(screen==="history") return renderHistory();
  if(screen==="people") return renderPeople();
  renderAttendance();
}
function headerTabs(){
 return `<div class="tabs">${GROUPS.map((g,i)=>`<button class="${i===group?'active':''}" onclick="selectGroup(${i})">${g}</button>`).join("")}</div>`;
}
function renderAttendance(){
 const date=document.getElementById("dateInput")?.value||today();
 const activity=document.getElementById("activityInput")?.value||"";
 const search=document.getElementById("searchInput")?.value||"";
 const people=currentPeople().filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));
 const regs=currentPeople().map(p=>recordFor(p.id,date)).filter(Boolean);
 const present=regs.filter(r=>r.status==="present").length, just=regs.filter(r=>r.status==="just").length;
 document.getElementById("app").innerHTML=`
 ${headerTabs()}
 <div class="actions"><button class="btn secondary" onclick="screen='people';render()">👥 Administrar personas</button><button class="btn secondary" onclick="screen='history';render()">📊 Historial</button></div>
 <div class="search"><span>⌕</span><input id="searchInput" value="${esc(search)}" placeholder="Buscar por nombre..." oninput="renderAttendanceKeep()"></div>
 <div class="grid2">
  <div class="field"><label>Fecha</label><input id="dateInput" type="date" value="${date}" onchange="renderAttendanceKeep()"></div>
  <div class="field"><label>Actividad</label><input id="activityInput" value="${esc(activity)}" placeholder="Ej. Laboratorio de Química" onchange="renderAttendanceKeep()"></div>
 </div>
 <div class="summary">${currentPeople().length} personas • ${present} presentes • ${regs.filter(r=>r.status==='absent').length} faltas • ${just} justificadas</div>
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Nº</th><th>NOMBRE</th><th>ASISTENCIA</th><th>JUSTIFICACIÓN</th><th>ESTADO</th></tr></thead><tbody>
 ${people.length?people.map((p,i)=>row(p,i,date,activity)).join(""):`<tr><td colspan="5"><div class="empty">No hay personas. Agrega nombres desde “Administrar personas”.</div></td></tr>`}
 </tbody></table></div></div>
 <div class="bottom"><button class="btn primary" style="width:100%;font-size:16px" onclick="saveCurrent('${date}')">💾 GUARDAR</button></div>`;
}
function renderAttendanceKeep(){renderAttendance()}
function row(p,i,date,activity){
 const r=recordFor(p.id,date); const st=r?.status||"absent"; const j=r?.justification||"";
 return `<tr><td class="small">${String(i+1).padStart(3,"0")}</td><td class="name">${esc(p.name)}</td>
 <td><input class="check" type="checkbox" ${st==="present"?"checked":""} onchange="toggleStatus(${p.id},'present','${date}','${esc(activity)}')"></td>
 <td><input style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px" value="${esc(j)}" placeholder="Motivo..." onchange="setJust(${p.id},this.value,'${date}','${esc(activity)}')"></td>
 <td><span class="status ${st==="present"?"present":st==="just"?"just":"absent"}">${st==="present"?"Presente":st==="just"?"Justificado":"Falta"}</span></td></tr>`;
}
function selectGroup(i){group=i;screen="attendance";render()}
function toggleStatus(pid,type,date,activity){
 let r=recordFor(pid,date);
 if(!r){ensureRecord(pid,date,activity,type);save();return render()}
 if(type==="present"){r.status=r.status==="present"?"absent":"present"; if(r.status!=="just")r.justification=""}
 save();render();
}
function setJust(pid,val,date,activity){
 let r=recordFor(pid,date);
 if(!r){ensureRecord(pid,date,activity,val.trim()?"just":"absent",val)}
 else{r.justification=val;r.status=val.trim()?"just":"absent"}
 save();render();
}
function saveCurrent(date){save();alert("Registro guardado correctamente.");}
function renderPeople(){
 const g=db.groups[group];
 document.getElementById("app").innerHTML=`
 <div class="actions"><button class="btn gray" onclick="screen='attendance';render()">← Volver</button><h2 style="margin:8px 0">${esc(g.name)} — Personas</h2></div>
 <div class="card" style="padding:14px"><p class="small">Puedes agregar personas una por una o pegar una lista de nombres, uno por línea. Esto permite cargar 150, 200 o más personas rápidamente.</p>
 <div class="actions"><button class="btn primary" onclick="openAddPerson()">➕ Agregar persona</button><button class="btn secondary" onclick="openBulk()">📋 Cargar muchos nombres</button></div></div>
 <div class="search" style="margin-top:12px"><span>⌕</span><input id="peopleSearch" placeholder="Buscar persona..." oninput="renderPeopleList()"></div>
 <div id="peopleList" class="card"></div>`;
 renderPeopleList();
}
function renderPeopleList(){
 const q=document.getElementById("peopleSearch")?.value?.toLowerCase()||"";
 const ps=currentPeople().filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById("peopleList").innerHTML=ps.length?ps.map(p=>`<div style="display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${esc(p.name)}</b><div class="small">ID ${p.id}</div></div><button class="btn secondary" onclick="editPerson(${p.id})">✏️</button><button class="btn danger" onclick="deletePerson(${p.id})">🗑️</button></div>`).join(""):`<div class="empty">No hay personas.</div>`;
}
function openAddPerson(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Agregar persona</h2><div class="field"><label>Nombre completo</label><input id="newPerson" autofocus></div><div class="actions"><button class="btn primary" onclick="addPerson()">Guardar</button></div>`)}
function addPerson(){
 const n=document.getElementById("newPerson").value.trim(); if(!n)return alert("Escribe un nombre.");
 const ps=currentPeople(); const id=ps.length?Math.max(...ps.map(p=>p.id))+1:1; ps.push({id,name:n}); save();closeModal();renderPeople();
}
function editPerson(id){
 const p=currentPeople().find(x=>x.id===id); if(!p)return;
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Editar persona</h2><div class="field"><label>Nombre completo</label><input id="editName" value="${esc(p.name)}"></div><div class="actions"><button class="btn primary" onclick="updatePerson(${id})">Guardar cambios</button></div>`);
}
function updatePerson(id){let n=document.getElementById("editName").value.trim();if(!n)return;let p=currentPeople().find(x=>x.id===id);p.name=n;save();closeModal();renderPeople()}
function deletePerson(id){if(!confirm("¿Eliminar esta persona? Sus registros históricos también se conservarán, pero la persona dejará de aparecer en el grupo."))return;db.groups[group].people=db.groups[group].people.filter(p=>p.id!==id);save();renderPeople()}
function openBulk(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Cargar muchos nombres</h2><p class="small">Pega un nombre por línea. Los nombres se agregarán al ${esc(GROUPS[group])}.</p><textarea id="bulkNames" placeholder="Juan Pérez&#10;María López&#10;Carlos García"></textarea><div class="actions"><button class="btn primary" onclick="bulkAdd()">Agregar nombres</button></div>`)}
function bulkAdd(){
 const names=document.getElementById("bulkNames").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!names.length)return;
 let ps=currentPeople(), next=ps.length?Math.max(...ps.map(p=>p.id))+1:1;
 const existing=new Set(ps.map(p=>p.name.toLowerCase()));
 for(const n of names){if(!existing.has(n.toLowerCase())){ps.push({id:next++,name:n});existing.add(n.toLowerCase())}}
 save();closeModal();renderPeople();alert(`${names.length} nombres procesados.`);
}
function renderHistory(){
 const allGroups=GROUPS.map((g,i)=>`<button class="btn ${i===group?'primary':'gray'}" onclick="group=${i};renderHistory()">${g}</button>`).join("");
 const people=currentPeople();
 const monthRecords=db.records.filter(r=>r.group===group&&ym(r.date)===monthKey);
 const stats=people.map(p=>{const rs=monthRecords.filter(r=>r.personId===p.id);return {p,a:rs.filter(r=>r.status==="present").length,j:rs.filter(r=>r.status==="just").length,f:rs.filter(r=>r.status==="absent").length}});
 const totals=stats.reduce((x,s)=>({a:x.a+s.a,j:x.j+s.j,f:x.f+s.f}),{a:0,j:0,f:0});
 document.getElementById("app").innerHTML=`
 <div class="actions"><button class="btn gray" onclick="screen='attendance';render()">← Volver</button><h2 style="margin:8px 0">📊 Historial</h2></div>
 <div class="actions">${allGroups}</div>
 <div class="months">${availableMonths().map(m=>`<button class="${m===monthKey?'active':''}" onclick="monthKey='${m}';renderHistory()">${monthName(m)}</button>`).join("")}</div>
 <div class="history-grid"><div class="metric green"><b>${totals.a}</b>Asistencias</div><div class="metric yellow"><b>${totals.j}</b>Justificadas</div><div class="metric red"><b>${totals.f}</b>Faltas</div></div>
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Nº</th><th>PERSONA</th><th>ASISTENCIAS</th><th>JUSTIFICADAS</th><th>FALTAS</th><th>TOTAL</th></tr></thead><tbody>
 ${stats.length?stats.map((s,i)=>`<tr><td>${String(i+1).padStart(3,"0")}</td><td class="name">${esc(s.p.name)}</td><td>${s.a}</td><td>${s.j}</td><td>${s.f}</td><td>${s.a+s.j+s.f}</td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">No hay personas en este grupo.</div></td></tr>`}
 </tbody></table></div></div>`;
}
function availableMonths(){
 const set=new Set([monthKey,...db.records.filter(r=>r.group===group).map(r=>ym(r.date))]);
 return [...set].sort().reverse();
}
function openSettings(){
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Configuración</h2>
 <div class="actions">
  <button class="btn secondary" onclick="exportExcel()">📊 Exportar para Excel (.csv)</button>
  <button class="btn secondary" onclick="document.getElementById('excelFile').click()">📥 Importar desde Excel (.csv)</button>
  <input id="excelFile" type="file" accept=".csv,.txt" style="display:none" onchange="importExcel(this)">
 </div>
 <div class="actions">
  <button class="btn secondary" onclick="exportData()">⬇️ Exportar respaldo completo (.json)</button>
  <button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆️ Importar respaldo (.json)</button>
  <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(this)">
 </div>
 <p class="small">Excel: exporta personas y asistencias a un archivo CSV que puedes abrir con Excel. Si lo editas, guárdalo como CSV separado por punto y coma para volver a importarlo. El respaldo JSON conserva todos los datos originales.</p>
 <button class="btn danger" onclick="resetAll()">⚠️ Borrar todos los datos</button>`);
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}), a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="respaldo_lista_asistencias.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
 const file=input.files[0];if(!file)return;const reader=new FileReader();
 reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.groups||!x.records)throw Error();db=x;save();closeModal();render();alert("Respaldo importado correctamente.")}catch(e){alert("El archivo no es válido.")}};
 reader.readAsText(file);
}

function csvCell(value){
 const s=String(value??"");
 return '"' + s.replace(/"/g,'""') + '"';
}
function exportExcel(){
 const rows=[["TIPO","GRUPO_NUMERO","GRUPO","PERSONA_ID","NOMBRE","FECHA","ACTIVIDAD","ESTADO","JUSTIFICACION"]];
 db.groups.forEach((g,gi)=>{
  g.people.forEach(p=>rows.push(["PERSONA",gi,g.name,p.id,p.name,"","","",""]));
 });
 db.records.forEach(r=>{
  const g=db.groups[r.group];
  const p=g?.people.find(x=>x.id===r.personId);
  rows.push(["ASISTENCIA",r.group,g?.name||"",r.personId,p?.name||"",r.date,r.activity||"",r.status==="present"?"PRESENTE":r.status==="just"?"JUSTIFICADA":"FALTA",r.justification||""]);
 });
 const csv="\uFEFF"+rows.map(row=>row.map(csvCell).join(";")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="lista_asistencias_excel.csv";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function parseCSV(text){
 text=text.replace(/^\uFEFF/,"");
 const rows=[];let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){
   if(c==='"'&&text[i+1]==='"'){cell+='"';i++}
   else if(c==='"')quoted=false;
   else cell+=c;
  }else{
   if(c==='"')quoted=true;
   else if(c===";"){row.push(cell);cell=""}
   else if(c==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}
   else cell+=c;
  }
 }
 if(cell.length||row.length){row.push(cell.replace(/\r$/,""));rows.push(row)}
 return rows;
}
function importExcel(input){
 const file=input.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const rows=parseCSV(reader.result);
   if(rows.length<2)throw Error("El archivo no contiene datos.");
   const head=rows[0].map(x=>x.trim().toUpperCase());
   const col=name=>head.indexOf(name);
   if(col("TIPO")<0||col("GRUPO_NUMERO")<0||col("PERSONA_ID")<0)throw Error("No encuentro las columnas necesarias. Usa un CSV exportado por este sistema.");
   if(!confirm("Importar este archivo reemplazará los datos actuales. Para protegerlos, exporta primero un respaldo. ¿Deseas continuar?")){input.value="";return}
   const groups=GROUPS.map((name,i)=>({name,people:[]}));
   const records=[];
   for(const row of rows.slice(1)){
    if(!row.some(v=>String(v||"").trim()))continue;
    const get=name=>{const i=col(name);return i<0?"":String(row[i]??"").trim()};
    const type=get("TIPO").toUpperCase(), gi=Number(get("GRUPO_NUMERO")), pid=Number(get("PERSONA_ID"));
    if(!Number.isInteger(gi)||gi<0||gi>3||!Number.isFinite(pid))continue;
    const groupName=get("GRUPO")||GROUPS[gi];
    groups[gi].name=groupName;
    if(type==="PERSONA"){
     const name=get("NOMBRE");if(name&&!groups[gi].people.some(p=>p.id===pid))groups[gi].people.push({id:pid,name});
    }else if(type==="ASISTENCIA"){
     const date=get("FECHA");if(!date)continue;
     const raw=get("ESTADO").toUpperCase();
     const status=raw==="PRESENTE"||raw==="PRESENT"?"present":raw==="JUSTIFICADA"||raw==="JUSTIFICADO"||raw==="JUST"?"just":"absent";
     records.push({group:gi,personId:pid,date,activity:get("ACTIVIDAD"),status,justification:get("JUSTIFICACION")});
    }
   }
   db={groups,records};save();closeModal();screen="attendance";render();
   alert("Datos importados desde Excel correctamente.");
  }catch(e){alert("No se pudo importar el archivo: "+e.message)}
  input.value="";
 };
 reader.readAsText(file,"UTF-8");
}

function resetAll(){if(confirm("¿Seguro que quieres borrar TODOS los grupos, personas y registros?")){db={groups:GROUPS.map(name=>({name,people:[]})),records:[]};save();closeModal();render()}}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function showHome(){screen="attendance";render()}
render();

// PWA: guardar los archivos básicos para que la aplicación abra sin conexión.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(err => {
      console.warn("No se pudo registrar el modo sin conexión:", err);
    });
  });
}
</script>
</body>
</html>
